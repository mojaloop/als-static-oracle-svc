# Set to true to disable the Grype image scan completely
disabled: false

ignore:
  - vulnerability: CVE-2025-60876
    reason: "No fix available in current Alpine base image (BusyBox/SSL)"
  - vulnerability: GHSA-xxjr-mmjv-4gpg
    reason: "Lodash issue requiring breaking change"
  - vulnerability: GHSA-5j98-mcp5-4vw2
    reason: "No fixes available for node 22.20.0-alpine3.21"
  - vulnerability: CVE-2024-58251
    reason: "No fixes available for node 22.20.0-alpine3.21"
  - vulnerability: CVE-2025-46394
    reason: "No fixes available for node 22.20.0-alpine3.21"
  - vulnerability: GHSA-r6q2-hw4h-h46w
    reason: "Tar vulnerability in Alpine/npm base - awaiting upstream fix"
  - vulnerability: GHSA-8qq5-rm4j-mr97
    reason: "Tar vulnerability in Alpine/npm base - awaiting upstream fix"

# Set output format defaults
output:
  - "table"
  - "json"

# Modify your CircleCI job to check critical count
search:
  scope: "squashed"
quiet: false
check-for-app-update: false
